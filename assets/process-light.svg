<svg xmlns="http://www.w3.org/2000/svg" width="840" height="112" viewBox="0 0 840 112" role="img" aria-label="Cómo trabajo: Brief → Spec → Código → Tests → Producción → Soporte"><title>Cómo trabajo: Brief → Spec → Código → Tests → Producción → Soporte</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes blink{50%{opacity:0}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes bar{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@keyframes scany{0%,100%{transform:translateY(0)}50%{transform:translateY(40px)}}
@keyframes scanx{0%,100%{transform:translateX(0)}50%{transform:translateX(78px)}}
@keyframes draw{0%{stroke-dashoffset:160}55%,100%{stroke-dashoffset:0}}
@keyframes spray{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(34px,-14px);opacity:0}}
@keyframes rise{0%,15%{transform:scaleY(0)}45%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes cell{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,5px)}}
@keyframes word{0%,3%{opacity:0;transform:translateY(8px)}6%,17%{opacity:1;transform:none}20%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes sheen{0%{transform:translateX(-140px)}60%,100%{transform:translateX(900px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.float{animation:float 4s ease-in-out infinite}
.flow{stroke-dasharray:4 4;animation:flow 1.2s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.tw{animation:tw 3.6s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:bar 1.3s ease-in-out infinite}
.nudge{animation:nudge 2.2s ease-in-out infinite}
.scany{animation:scany 3s ease-in-out infinite}
.scanx{animation:scanx 3.2s ease-in-out infinite}
.draw{stroke-dasharray:160;animation:draw 4s ease-out infinite}
.spray{animation:spray 2.2s ease-out infinite}
.rise{transform-box:fill-box;transform-origin:bottom;animation:rise 4s ease-in-out infinite}
.cell{animation:cell 3s ease-in-out infinite}
.drift{animation:drift 14s ease-in-out infinite}
.word{opacity:0;animation:word 15s ease-in-out infinite}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes wave{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes grow{0%{transform:scaleX(0)}25%,100%{transform:scaleX(1)}}
.wave{animation:wave 5s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 8s cubic-bezier(.3,.7,.2,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.word{opacity:0}.w0{opacity:1}}
</style><rect x=".5" y=".5" width="839" height="111" rx="14" fill="#f6f5f0" stroke="#d6d5cc"/><path class="flow" d="M70 46H770" stroke="#5d655f" stroke-width="1.6" fill="none"/><circle r="5" cy="46" fill="#4f6f5c"><animate attributeName="cx" values="70;770" dur="6s" repeatCount="indefinite"/></circle><circle cx="70" cy="46" r="13" fill="#ffffff" stroke="#d6d5cc" stroke-width="1.6"/><text class="m" x="70" y="50" font-size="10.5" text-anchor="middle" fill="#5d655f">01</text><text class="m" x="70" y="86" font-size="12" text-anchor="middle" fill="#151a18">Brief</text><circle cx="210" cy="46" r="13" fill="#ffffff" stroke="#d6d5cc" stroke-width="1.6"/><text class="m" x="210" y="50" font-size="10.5" text-anchor="middle" fill="#5d655f">02</text><text class="m" x="210" y="86" font-size="12" text-anchor="middle" fill="#151a18">Spec</text><circle cx="350" cy="46" r="13" fill="#ffffff" stroke="#d6d5cc" stroke-width="1.6"/><text class="m" x="350" y="50" font-size="10.5" text-anchor="middle" fill="#5d655f">03</text><text class="m" x="350" y="86" font-size="12" text-anchor="middle" fill="#151a18">Código</text><circle cx="490" cy="46" r="13" fill="#ffffff" stroke="#d6d5cc" stroke-width="1.6"/><text class="m" x="490" y="50" font-size="10.5" text-anchor="middle" fill="#5d655f">04</text><text class="m" x="490" y="86" font-size="12" text-anchor="middle" fill="#151a18">Tests</text><circle cx="630" cy="46" r="13" fill="#ffffff" stroke="#2f8f5b" stroke-width="1.6"/><text class="m" x="630" y="50" font-size="10.5" text-anchor="middle" fill="#5d655f">05</text><text class="m" x="630" y="86" font-size="12" text-anchor="middle" fill="#151a18">Producción</text><circle cx="770" cy="46" r="13" fill="#ffffff" stroke="#d6d5cc" stroke-width="1.6"/><text class="m" x="770" y="50" font-size="10.5" text-anchor="middle" fill="#5d655f">06</text><text class="m" x="770" y="86" font-size="12" text-anchor="middle" fill="#151a18">Soporte</text></svg>
