<svg xmlns="http://www.w3.org/2000/svg" width="412" height="196" viewBox="0 0 412 196" role="img" aria-label="Auditoría Actual Online (Responsible disclosure): Hallazgo en la superficie pública, contacto con la empresa y auditoría autorizada: 22 hallazgos, re-auditoría y plan de remediación. Stack: API security, OWASP, Auth."><title>Auditoría Actual Online (Responsible disclosure): Hallazgo en la superficie pública, contacto con la empresa y auditoría autorizada: 22 hallazgos, re-auditoría y plan de remediación. Stack: API security, OWASP, Auth.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes blink{50%{opacity:0}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes bar{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@keyframes scany{0%,100%{transform:translateY(0)}50%{transform:translateY(40px)}}
@keyframes scanx{0%,100%{transform:translateX(0)}50%{transform:translateX(78px)}}
@keyframes draw{0%{stroke-dashoffset:160}55%,100%{stroke-dashoffset:0}}
@keyframes spray{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(34px,-14px);opacity:0}}
@keyframes rise{0%,15%{transform:scaleY(0)}45%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes cell{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,5px)}}
@keyframes word{0%{opacity:0;transform:translateY(10px)}2.5%,14%{opacity:1;transform:none}16.6%,100%{opacity:0;transform:translateY(-10px)}}
@keyframes sheen{0%{transform:translateX(-140px)}60%,100%{transform:translateX(900px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.float{animation:float 4s ease-in-out infinite}
.flow{stroke-dasharray:4 4;animation:flow 1.2s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.tw{animation:tw 3.6s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:bar 1.3s ease-in-out infinite}
.nudge{animation:nudge 2.2s ease-in-out infinite}
.scany{animation:scany 3s ease-in-out infinite}
.scanx{animation:scanx 3.2s ease-in-out infinite}
.draw{stroke-dasharray:160;animation:draw 4s ease-out infinite}
.spray{animation:spray 2.2s ease-out infinite}
.rise{transform-box:fill-box;transform-origin:bottom;animation:rise 4s ease-in-out infinite}
.cell{animation:cell 3s ease-in-out infinite}
.drift{animation:drift 14s ease-in-out infinite}
.word{opacity:0;animation:word 18s cubic-bezier(.16,1,.3,1) infinite}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes wave{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes grow{0%{transform:scaleX(0)}25%,100%{transform:scaleX(1)}}
.wave{animation:wave 5s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 8s cubic-bezier(.3,.7,.2,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.word{opacity:0}.w0{opacity:1}}
</style><path d="M16.5 0.5H411.5V179.5L395.5 195.5H0.5V16.5Z" fill="#111514" stroke="#2b332f"/><text x="22" y="36" font-size="10.5" font-weight="600" letter-spacing="1.3" fill="#8fb39c">RESPONSIBLE DISCLOSURE</text><g transform="translate(296,14)"><circle class="ping" cx="48" cy="28" r="12" fill="none" stroke="#8fb39c" stroke-width="1.5"/><circle class="ping" style="animation-delay:-1.2s" cx="48" cy="28" r="12" fill="none" stroke="#8fb39c" stroke-width="1.5"/><path d="M48 6 L66 13 V28 C66 40 58 48 48 52 C38 48 30 40 30 28 V13Z" fill="#171c1a" stroke="#8fb39c" stroke-width="1.8"/><path d="M40 28 l6 6 l11 -12" fill="none" stroke="#8fb39c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="22" y="80" font-size="21" font-weight="700" letter-spacing="-.2" fill="#e8ece8">Auditoría Actual Online</text><text x="22" y="103" font-size="12.5" fill="#9ea49f">Hallazgo en la superficie pública, contacto con la</text><text x="22" y="121" font-size="12.5" fill="#9ea49f">empresa y auditoría autorizada: 22 hallazgos,</text><text x="22" y="139" font-size="12.5" fill="#9ea49f">re-auditoría y plan de remediación.</text><rect x="22.0" y="156" width="88.0" height="22" rx="2" fill="#1f2623" stroke="#2b332f"/><text class="m" x="30.0" y="171" font-size="10" fill="#9ea49f">API security</text><rect x="116.0" y="156" width="46.0" height="22" rx="2" fill="#1f2623" stroke="#2b332f"/><text class="m" x="124.0" y="171" font-size="10" fill="#9ea49f">OWASP</text><rect x="168.0" y="156" width="40.0" height="22" rx="2" fill="#1f2623" stroke="#2b332f"/><text class="m" x="176.0" y="171" font-size="10" fill="#9ea49f">Auth</text></svg>
