t x="20" y="103" font-size="12.5" fill="#5d655f">Entradas para eventos: reserva atómica de stock,</text><text x="20" y="121" font-size="12.5" fill="#5d655f">webhook de pagos idempotente, QR firmado con</text><text x="20" y="139" font-size="12.5" fill="#5d655f">HMAC y check-in atómico en portería.</text><rect x="20.0" y="156" width="60.0" height="22" rx="11" fill="#ebeae3" stroke="#d6d5cc"/><text class="m" x="29.0" y="171" font-size="10" fill="#5d655f">Next.js</text><rect x="86.0" y="156" width="66.0" height="22" rx="11" fill="#ebeae3" stroke="#d6d5cc"/><text class="m" x="95.0" y="171" font-size="10" fill="#5d655f">Supabase</text><rect x="158.0" y="156" width="90.0" height="22" rx="11" fill="#ebeae3" stroke="#d6d5cc"/><text class="m" x="167.0" y="171" font-size="10" fill="#5d655f">Mercado Pago</text><rect x="254.0" y="156" width="36.0" height="22" rx="11" fill="#ebeae3" stroke="#d6d5cc"/><text class="m" x="263.0" y="171" font-size="10" fill="#5d655f">Zod</text></svg>
