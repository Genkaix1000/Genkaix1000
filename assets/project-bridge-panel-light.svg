 fill="#ebeae3" stroke="#d6d5cc" stroke-width=".6"/><rect x="60.0" y="40" width="7" height="7" rx="2" fill="#ebeae3" stroke="#d6d5cc" stroke-width=".6"/><rect class="cell" style="animation-delay:-6.29s" x="70.5" y="40" width="7" height="7" rx="2" fill="#4f6f5c"/></g><text x="22" y="80" font-size="21" font-weight="700" letter-spacing="-.2" fill="#151a18">Bridge Panel</text><text x="22" y="103" font-size="12.5" fill="#5d655f">Calendario interno del equipo: reuniones,</text><text x="22" y="121" font-size="12.5" fill="#5d655f">deadlines y timeline por proyecto. PWA pensada</text><text x="22" y="139" font-size="12.5" fill="#5d655f">para usarse con una mano desde el celular.</text><rect x="22.0" y="156" width="40.0" height="22" rx="2" fill="#ebeae3" stroke="#d6d5cc"/><text class="m" x="30.0" y="171" font-size="10" fill="#5d655f">Vite</text><rect x="68.0" y="156" width="46.0" height="22" rx="2" fill="#ebeae3" stroke="#d6d5cc"/><text class="m" x="76.0" y="171" font-size="10" fill="#5d655f">React</text><rect x="120.0" y="156" width="52.0" height="22" rx="2" fill="#ebeae3" stroke="#d6d5cc"/><text class="m" x="128.0" y="171" font-size="10" fill="#5d655f">Motion</text><rect x="178.0" y="156" width="64.0" height="22" rx="2" fill="#ebeae3" stroke="#d6d5cc"/><text class="m" x="186.0" y="171" font-size="10" fill="#5d655f">Supabase</text></svg>
