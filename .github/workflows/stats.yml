name: Actualizar actividad del perfil

on:
  schedule:
    - cron: "17 9 * * *" # una vez por día, 06:17 de Argentina
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar SVG de actividad
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python3 scripts/stats.py
      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || git commit -m "chore: actualizar actividad del perfil"
          git push
